name: Build Scrappy release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            echo "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  /tmp/gradle.zip" | sha256sum -c -
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1
          fi

      - name: Decode signing keystore
        env:
          SCRAPPY_KEYSTORE_BASE64: ${{ secrets.SCRAPPY_KEYSTORE_BASE64 }}
        run: echo "$SCRAPPY_KEYSTORE_BASE64" | base64 -d > /tmp/scrappy-upload.jks

      - name: Build signed release bundle
        env:
          SCRAPPY_KEYSTORE_PATH: /tmp/scrappy-upload.jks
          SCRAPPY_KEYSTORE_PASSWORD: ${{ secrets.SCRAPPY_KEYSTORE_PASSWORD }}
          SCRAPPY_KEY_ALIAS: scrappy-upload
          SCRAPPY_KEY_PASSWORD: ${{ secrets.SCRAPPY_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PscrappyAiEndpoint="${{ vars.SCRAPPY_AI_ENDPOINT }}" \
            -PscrappyAiPrivacyUrl="${{ vars.SCRAPPY_AI_PRIVACY_URL }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrappy-release-aab
          path: app/build/outputs/bundle/release/*.aab
